name: PythonMonkey macOS exit check

# Experiment: does PythonMonkey still crash Python at exit on macOS with
# Python 3.12+? (See _PYTHONMONKEY_BROKEN in codewiki/src/be/utils.py.)
# 1.2.0 is the currently pinned version and the control.
# On Linux, the caw scenario segfaults with both versions as soon as
# PythonMonkey is first imported on a worker thread; caw-preimport (import on
# the main thread first) does not. The scenarios are printed per run below.
on:
  push:
    branches: [experiment/pythonmonkey-macos]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }} / pythonmonkey ${{ matrix.pythonmonkey }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        python: ["3.12", "3.13", "3.14"]
        pythonmonkey: ["1.2.0", "1.4.1"]
        exclude:
          # 1.2.0 predates Python 3.14 support (added in 1.3.0).
          - pythonmonkey: "1.2.0"
            python: "3.14"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # PythonMonkey's pminit runs npm at install time.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pythonmonkey==${{ matrix.pythonmonkey }}"
          python -c "import importlib.metadata as m; print('pythonmonkey', m.version('pythonmonkey'))"

      - name: Validate and exit, 5 runs per scenario
        shell: bash
        run: |
          fail=0
          for mode in main caw caw-preimport; do
            for i in 1 2 3 4 5; do
              set +e
              python -u -X faulthandler .github/pythonmonkey-check/check.py "$mode"
              code=$?
              set -e
              echo "== $mode run $i: exit $code"
              if [ "$code" -ne 0 ]; then fail=1; fi
            done
          done
          exit "$fail"

      - name: Collect macOS crash reports
        if: always()
        run: |
          mkdir -p crashes
          cp ~/Library/Logs/DiagnosticReports/*ython* crashes/ 2>/dev/null || true
          ls -la crashes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crashes-${{ matrix.os }}-py${{ matrix.python }}-pm${{ matrix.pythonmonkey }}
          path: crashes/
          if-no-files-found: ignore
