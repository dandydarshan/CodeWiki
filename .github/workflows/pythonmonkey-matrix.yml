# Run by hand: does PythonMonkey's Mermaid parse crash, and on which OS / CPU /
# Python / PythonMonkey combinations? A red job is a native crash.
# Background: on Windows + Python 3.14.3 with PythonMonkey 1.3.1, every awaited
# JS promise crashed (access violation): the wheel reads CPython's thread state
# at an offset from 3.14.4+ headers, which added a field to PyThreadState.
name: PythonMonkey matrix

on:
  workflow_dispatch:
  push:
    branches: [pythonmonkey-matrix]  # throwaway branch: pushing it runs the matrix

permissions:
  contents: read

jobs:
  probe:
    name: ${{ matrix.os }} / py${{ matrix.python }} / pm ${{ matrix.pythonmonkey }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
        python: ["3.12", "3.13", "3.14.3", "3.14", "3.15"]
        pythonmonkey: ["1.3.1", "1.4.1"]
        exclude:
          - python: "3.15"  # 1.3.1 has no cp315 wheels
            pythonmonkey: "1.3.1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install PythonMonkey and the Mermaid parser
        # Wheels only: building PythonMonkey from source compiles SpiderMonkey (hours).
        run: python -m pip install --only-binary pythonmonkey "pythonmonkey==${{ matrix.pythonmonkey }}" "mermaid-parser-py==0.0.4"

      - name: Narrow by PythonMonkey subsystem
        shell: bash
        run: |
          set -o pipefail
          python scripts/pm_narrow.py | tee narrow.txt

      - name: Mermaid parse, as CodeWiki does it
        if: success() || failure()
        shell: bash
        run: |
          set -o pipefail
          python scripts/pythonmonkey_repro.py | tee repro.txt

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} / Python ${{ matrix.python }} / PythonMonkey ${{ matrix.pythonmonkey }}"
            echo '```'
            cat narrow.txt repro.txt 2>/dev/null || echo "scripts did not run (install failed?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
